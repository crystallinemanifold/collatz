<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continuous Collatz Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neonCyan: '#06b6d4',
                        neonFuchsia: '#d946ef',
                        darkSpace: '#0b0f19',
                        panelBg: '#111827'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .neon-text-cyan { text-shadow: 0 0 10px rgba(6, 182, 212, 0.7); }
        .neon-text-fuchsia { text-shadow: 0 0 10px rgba(217, 70, 239, 0.7); }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #1f2937; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <div class="max-w-6xl w-full grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Controls Panel -->
        <div class="bg-panelBg p-6 rounded-2xl shadow-[0_0_20px_rgba(217,70,239,0.15)] border border-gray-800 flex flex-col gap-6">
            <div>
                <h1 class="text-3xl font-bold text-neonFuchsia neon-text-fuchsia mb-2">Chamberland Orbit</h1>
                <p class="text-sm text-gray-400">Continuous extension to the complex plane.</p>
                <div class="mt-3 p-3 bg-gray-900 rounded border border-gray-800 font-mono text-xs text-neonCyan overflow-x-auto whitespace-nowrap">
                    f(z) = ¼(1 + 4z - (1 + 2z)cos(πz))
                </div>
            </div>

            <div class="flex flex-col gap-4">
                <div class="bg-gray-900/50 p-4 rounded border border-gray-800">
                    <h3 class="text-xs font-semibold text-neonCyan uppercase tracking-wider mb-3">Starting Coordinate z₀</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs text-gray-500">Real Part (x)</label>
                            <input type="number" step="0.1" id="reInput" value="27" class="w-full mt-1 bg-gray-800 border border-gray-700 rounded p-1.5 text-sm text-white focus:outline-none focus:border-neonFuchsia">
                        </div>
                        <div>
                            <label class="text-xs text-gray-500">Imaginary Part (yi)</label>
                            <input type="number" step="0.1" id="imInput" value="0" class="w-full mt-1 bg-gray-800 border border-gray-700 rounded p-1.5 text-sm text-white focus:outline-none focus:border-neonFuchsia">
                        </div>
                    </div>
                </div>

                <div>
                    <label class="text-xs text-gray-500">Max Iterations (Caps early if diverging)</label>
                    <input type="number" id="stepInput" value="100" class="w-full mt-1 bg-gray-900 border border-gray-700 rounded p-2 text-white focus:outline-none focus:border-neonCyan">
                </div>
                
                <button onclick="runSimulation()" class="w-full bg-gradient-to-r from-neonFuchsia to-purple-600 hover:from-fuchsia-400 hover:to-purple-500 text-white font-bold py-3 rounded-lg shadow-[0_0_15px_rgba(217,70,239,0.4)] transition-all transform hover:scale-105 active:scale-95">
                    Plot Complex Orbit
                </button>
            </div>

            <div class="mt-auto pt-6 border-t border-gray-800 grid grid-cols-2 gap-4">
                <div>
                    <p class="text-xs text-gray-500">Steps Taken</p>
                    <p id="stepCount" class="text-2xl font-bold text-white">0</p>
                </div>
                <div>
                    <p class="text-xs text-gray-500">End State</p>
                    <p id="endState" class="text-sm font-bold text-white mt-1">Converged</p>
                </div>
            </div>
            
            <div id="escapeWarning" class="hidden text-xs text-red-400 mt-2 bg-red-900/20 p-2 rounded border border-red-900">
                ⚠️ Orbit escaped. Hyperbolic cosine causes rapid divergence for y ≠ 0.
            </div>
        </div>

        <!-- Chart & List Panel -->
        <div class="lg:col-span-2 flex flex-col gap-6">
            
            <div class="bg-panelBg p-4 rounded-2xl shadow-lg border border-gray-800 h-96 relative">
                <canvas id="complexChart"></canvas>
            </div>

            <div class="bg-panelBg p-4 rounded-2xl shadow-lg border border-gray-800 flex-grow h-64 flex flex-col">
                <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-3">Complex Sequence</h3>
                <div id="sequenceList" class="flex-grow overflow-y-auto custom-scroll grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2 pr-2">
                    <!-- Numbers inject here -->
                </div>
            </div>
            
        </div>
    </div>

    <script>
        let chartInstance = null;

        // Custom Complex Math Parser
        function chamberland(z) {
            const PI = Math.PI;
            
            // cos(pi*z) = cos(pi*x)cosh(pi*y) - i*sin(pi*x)sinh(pi*y)
            const cosPiX = Math.cos(PI * z.re);
            const coshPiY = Math.cosh(PI * z.im);
            const sinPiX = Math.sin(PI * z.re);
            const sinhPiY = Math.sinh(PI * z.im);
            
            const cosZ = {
                re: cosPiX * coshPiY,
                im: -sinPiX * sinhPiY
            };
            
            // (1 + 2z)
            const term2z = { re: 1 + 2 * z.re, im: 2 * z.im };
            
            // (1+2z) * cos(pi*z)
            const mult = {
                re: term2z.re * cosZ.re - term2z.im * cosZ.im,
                im: term2z.re * cosZ.im + term2z.im * cosZ.re
            };
            
            // f(z) = 0.25 * (1 + 4z - mult)
            return {
                re: 0.25 * (1 + 4 * z.re - mult.re),
                im: 0.25 * (4 * z.im - mult.im)
            };
        }

        function formatComplex(z) {
            let re = z.re.toFixed(4);
            let im = z.im.toFixed(4);
            if (Math.abs(z.im) < 1e-6) return re;
            if (z.im >= 0) return `${re} + ${im}i`;
            return `${re} - ${Math.abs(z.im).toFixed(4)}i`;
        }

        function runSimulation() {
            const startRe = parseFloat(document.getElementById('reInput').value) || 0;
            const startIm = parseFloat(document.getElementById('imInput').value) || 0;
            const maxSteps = parseInt(document.getElementById('stepInput').value) || 100;
            
            let sequence = [{ re: startRe, im: startIm }];
            let current = sequence[0];
            let steps = 0;
            let escaped = false;

            while (steps < maxSteps) {
                // If it hits exactly 1 + 0i (the 1-2 loop shortcut), halt to prevent chart clutter
                if (Math.abs(current.re - 1) < 1e-10 && Math.abs(current.im) < 1e-10) {
                    break;
                }

                current = chamberland(current);
                sequence.push(current);
                steps++;

                // cosh(y) grows exponentially. Without a hard limit, JS will crash into Infinity.
                if (Math.abs(current.re) > 1e10 || Math.abs(current.im) > 1e10) {
                    escaped = true;
                    break;
                }
            }

            updateUI(sequence, escaped);
        }

        function updateUI(sequence, escaped) {
            document.getElementById('stepCount').innerText = sequence.length - 1;
            document.getElementById('escapeWarning').style.display = escaped ? 'block' : 'none';
            document.getElementById('endState').innerText = escaped ? 'Escaped to Infinity' : (sequence[sequence.length-1].re === 1 ? 'Converged to 1' : 'Halted');
            document.getElementById('endState').className = escaped ? 'text-sm font-bold text-red-400 mt-1' : 'text-sm font-bold text-neonCyan mt-1';

            const listEl = document.getElementById('sequenceList');
            listEl.innerHTML = '';
            sequence.forEach((z, index) => {
                const item = document.createElement('div');
                item.className = 'bg-gray-800/50 p-2 rounded border border-gray-700/50 text-center font-mono flex flex-col justify-center';
                
                if (index === sequence.length - 1) {
                    item.classList.add('border-neonFuchsia', 'text-neonFuchsia', 'font-bold');
                } else {
                    item.classList.add('text-gray-300');
                }
                item.innerHTML = `<span class="text-[10px] text-gray-500 mb-1">Step ${index}</span><span class="text-sm truncate">${formatComplex(z)}</span>`;
                listEl.appendChild(item);
            });

            updateChart(sequence);
        }

        function updateChart(sequence) {
            const ctx = document.getElementById('complexChart').getContext('2d');
            
            const chartData = sequence.map(z => ({ x: z.re, y: z.im }));

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'scatter',
                data: {
                    datasets: [{
                        label: 'Orbit Trajectory',
                        data: chartData,
                        borderColor: '#d946ef',
                        backgroundColor: '#06b6d4',
                        borderWidth: 1.5,
                        pointRadius: 3,
                        pointHoverRadius: 6,
                        showLine: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `Step ${context.dataIndex}: ${context.raw.x.toFixed(2)} + ${context.raw.y.toFixed(2)}i`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { 
                            title: { display: true, text: 'Real Axis', color: '#9ca3af' },
                            ticks: { color: '#9ca3af' }, 
                            grid: { color: 'rgba(31, 41, 55, 0.8)' } 
                        },
                        y: { 
                            title: { display: true, text: 'Imaginary Axis', color: '#9ca3af' },
                            ticks: { color: '#9ca3af' }, 
                            grid: { color: 'rgba(31, 41, 55, 0.8)' } 
                        }
                    }
                }
            });
        }

        window.onload = runSimulation;
    </script>
</body>
</html>
