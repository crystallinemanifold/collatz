<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collatz Conjecture Explorer</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Tailwind Configuration for Neon Theme -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neonCyan: '#06b6d4',
                        neonFuchsia: '#d946ef',
                        darkSpace: '#0b0f19',
                        panelBg: '#111827'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .neon-text-cyan { text-shadow: 0 0 10px rgba(6, 182, 212, 0.7); }
        .neon-text-fuchsia { text-shadow: 0 0 10px rgba(217, 70, 239, 0.7); }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #1f2937; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <div class="max-w-6xl w-full grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Header & Controls Panel -->
        <div class="bg-panelBg p-6 rounded-2xl shadow-[0_0_20px_rgba(6,182,212,0.15)] border border-gray-800 flex flex-col gap-6">
            <div>
                <h1 class="text-3xl font-bold text-neonCyan neon-text-cyan mb-2">Collatz Simulator</h1>
                <p class="text-sm text-gray-400">Explore the 3n+1 problem and its alternate realities.</p>
            </div>

            <div class="flex flex-col gap-4">
                <div>
                    <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Starting Number</label>
                    <input type="number" id="startInput" value="27" class="w-full mt-1 bg-gray-900 border border-gray-700 rounded p-2 text-white focus:outline-none focus:border-neonCyan transition-colors">
                </div>

                <div class="bg-gray-900/50 p-4 rounded border border-gray-800">
                    <h3 class="text-xs font-semibold text-neonFuchsia uppercase tracking-wider mb-3">Custom Ruleset</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs text-gray-500">Multiplier</label>
                            <input type="number" id="multInput" value="3" class="w-full mt-1 bg-gray-800 border border-gray-700 rounded p-1.5 text-sm text-white focus:outline-none focus:border-neonFuchsia">
                        </div>
                        <div>
                            <label class="text-xs text-gray-500">Adder</label>
                            <input type="number" id="addInput" value="1" class="w-full mt-1 bg-gray-800 border border-gray-700 rounded p-1.5 text-sm text-white focus:outline-none focus:border-neonFuchsia">
                        </div>
                        <div class="col-span-2">
                            <label class="text-xs text-gray-500">Divisor (Even Rule)</label>
                            <input type="number" id="divInput" value="2" class="w-full mt-1 bg-gray-800 border border-gray-700 rounded p-1.5 text-sm text-white focus:outline-none focus:border-neonFuchsia">
                        </div>
                    </div>
                </div>
                
                <button onclick="runSimulation()" class="w-full bg-gradient-to-r from-neonCyan to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold py-3 rounded-lg shadow-[0_0_15px_rgba(6,182,212,0.4)] transition-all transform hover:scale-105 active:scale-95">
                    Generate Sequence
                </button>
            </div>

            <div class="mt-auto pt-6 border-t border-gray-800 grid grid-cols-2 gap-4">
                <div>
                    <p class="text-xs text-gray-500">Total Steps</p>
                    <p id="stepCount" class="text-2xl font-bold text-white">0</p>
                </div>
                <div>
                    <p class="text-xs text-gray-500">Peak Value</p>
                    <p id="peakValue" class="text-2xl font-bold text-white">0</p>
                </div>
            </div>
            <div id="cycleWarning" class="hidden text-xs text-red-400 mt-2 bg-red-900/20 p-2 rounded border border-red-900">
                ⚠️ Sequence trapped in a recurring cycle. Simulation halted early.
            </div>
        </div>

        <!-- Chart & List Panel -->
        <div class="lg:col-span-2 flex flex-col gap-6">
            
            <div class="bg-panelBg p-4 rounded-2xl shadow-lg border border-gray-800 h-80 relative">
                <canvas id="collatzChart"></canvas>
            </div>

            <div class="bg-panelBg p-4 rounded-2xl shadow-lg border border-gray-800 flex-grow h-64 flex flex-col">
                <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-3">Sequence Steps</h3>
                <div id="sequenceList" class="flex-grow overflow-y-auto custom-scroll grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-2 pr-2">
                    <!-- Numbers inject here -->
                </div>
            </div>
            
        </div>
    </div>

    <script>
        let chartInstance = null;

        function runSimulation() {
            const start = parseInt(document.getElementById('startInput').value) || 27;
            const mult = parseInt(document.getElementById('multInput').value) || 3;
            const add = parseInt(document.getElementById('addInput').value) || 1;
            const div = parseInt(document.getElementById('divInput').value) || 2;
            
            let sequence = [start];
            let current = start;
            let steps = 0;
            let cycleDetected = false;
            let seen = new Set([start]);

            // Cap at 2000 steps to prevent browser crash from infinite custom rules
            while (current !== 1 && steps < 2000) {
                if (current % div === 0) {
                    current = current / div;
                } else {
                    current = (current * mult) + add;
                }
                
                sequence.push(current);
                steps++;

                if (seen.has(current)) {
                    cycleDetected = true;
                    break;
                }
                seen.add(current);
            }

            updateUI(sequence, cycleDetected);
        }

        function updateUI(sequence, cycleDetected) {
            document.getElementById('stepCount').innerText = sequence.length - 1;
            document.getElementById('peakValue').innerText = Math.max(...sequence).toLocaleString();
            document.getElementById('cycleWarning').style.display = cycleDetected ? 'block' : 'none';

            const listEl = document.getElementById('sequenceList');
            listEl.innerHTML = '';
            sequence.forEach((num, index) => {
                const item = document.createElement('div');
                item.className = 'bg-gray-800/50 p-2 rounded border border-gray-700/50 text-center text-sm font-mono flex flex-col justify-center';
                
                if (index === sequence.length - 1) {
                    item.classList.add('border-neonCyan', 'text-neonCyan', 'font-bold');
                } else {
                    item.classList.add('text-gray-300');
                }
                item.innerHTML = `<span class="text-[10px] text-gray-500 mb-1">Step ${index}</span>${num.toLocaleString()}`;
                listEl.appendChild(item);
            });

            updateChart(sequence);
        }

        function updateChart(sequence) {
            const ctx = document.getElementById('collatzChart').getContext('2d');
            const labels = sequence.map((_, i) => i);
            
            if (chartInstance) chartInstance.destroy();

            let gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, 'rgba(6, 182, 212, 0.5)'); 
            gradient.addColorStop(1, 'rgba(6, 182, 212, 0.0)'); 

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Value',
                        data: sequence,
                        borderColor: '#06b6d4',
                        backgroundColor: gradient,
                        borderWidth: 2,
                        pointBackgroundColor: '#d946ef',
                        pointBorderColor: '#0b0f19',
                        pointRadius: sequence.length > 100 ? 0 : 3, 
                        fill: true,
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#9ca3af' }, grid: { color: 'rgba(31, 41, 55, 0.5)' } },
                        // Logarithmic scale handles massive numerical spikes naturally
                        y: { type: 'logarithmic', ticks: { color: '#9ca3af' }, grid: { color: 'rgba(31, 41, 55, 0.5)' } }
                    }
                }
            });
        }

        window.onload = runSimulation;
    </script>
</body>
</html>
